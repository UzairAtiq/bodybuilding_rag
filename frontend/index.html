<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FITNESS BOT</title>

    <!-- on-screen error banner for mobile / webkit debugging -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:16px;font-size:14px;font-family:monospace;white-space:pre-wrap;z-index:999999;word-break:break-word;max-height:50vh;overflow:auto;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        el.innerText = 'ERROR: ' + msg + '\nFile: ' + url + '\nLine: ' + line + (col ? ':' + col : '') + (error && error.stack ? '\nStack:\n' + error.stack : '');
        (document.body || document.documentElement).appendChild(el);
      };

      window.addEventListener('unhandledrejection', function(event) {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#d97706;color:white;padding:16px;font-size:14px;font-family:monospace;white-space:pre-wrap;z-index:999999;word-break:break-word;max-height:50vh;overflow:auto;box-shadow:0 -4px 6px rgba(0,0,0,0.3);';
        var reason = event.reason;
        var detail = (reason && (reason.stack || reason.message)) ? (reason.stack || reason.message) : String(reason);
        el.innerText = 'PROMISE ERROR:\n' + detail;
        (document.body || document.documentElement).appendChild(el);
      });
    </script>
    
    <!-- preconnect and load bold high-impact fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-[#7a1f2b] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
